name: docs-test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/docs.test.yml"
      - "docs/**"
      - "scripts/verify-docs.mjs"

permissions:
  contents: read

jobs:
  test:
    env:
      DOCS_SITE_URL: https://priemskiyyy.github.io/simulcast/
      DOCS_BASE_PATH: /simulcast/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # VitePress fails the build on dead internal links, so this doubles as a
      # link check for every page.
      - name: Check documentation component types
        run: pnpm lint:docs

      - name: Build documentation
        run: pnpm build:docs

      - name: Verify documentation metadata and assets
        run: pnpm verify:docs
