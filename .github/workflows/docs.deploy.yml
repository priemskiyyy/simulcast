name: docs-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/docs.deploy.yml"
      - "docs/**"
      - "scripts/verify-docs.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Check documentation component types
        run: pnpm lint:docs

      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          DOCS_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: pnpm build:docs

      - name: Verify documentation metadata and assets
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm verify:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
